name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned rather than matrixed. Running a portfolio Flask app against
          # three interpreters burns CI minutes to tell us nothing we act on.
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff==0.16.2

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Format check
        working-directory: backend
        run: ruff format --check .

      - name: Tests
        working-directory: backend
        run: python -m pytest -q --cov=watchtower --cov-report=term-missing:skip-covered

      # No coverage threshold. A number that has to be met gets met by writing
      # tests that execute lines without asserting anything, which is the exact
      # failure this project exists to remove. It is printed to be read.

      # The gate that protects the premise: no invented numbers, and no
      # re-adoption of the names the project retired. It lives in a script
      # rather than inline shell because the inline version it replaces was
      # wrong twice — `grep -rn .` emits ./-prefixed paths under GNU grep and
      # bare paths under BSD grep, breaking its own allowlist; and a plain
      # substring search flagged the six lines of prose that *explain* what was
      # removed. See the script's docstring.
      - name: No fabricated values may return
        run: python scripts/check_no_fabrication.py

      # A detection-regression gate that needs no downloads: the loghub 2k
      # samples are committed. Drain's masking config is the most fragile thing
      # in the detection path, and when it breaks nothing raises — the pipeline
      # runs, the dashboard renders, and the feature vectors become noise.
      #
      # Floors only on parsing accuracy. A floor on the anomaly-detection F1
      # would have to be set against a 2,200-block subset, which would either be
      # meaningless or would quietly turn a subset result into a claim about the
      # full benchmark.
      - name: Detection regression floor
        run: python scripts/check_detection_floor.py

      # docs/metrics.json is written by the benchmark; docs/METRICS.md is
      # generated from it in the same call. The README and the handoff are
      # hand-written, and that is the gap this closes — a figure copied into
      # prose today is a figure nobody re-copies when the benchmark is re-run.
      # Unifying the frozen split moved IsolationForest 0.0775 -> 0.0640 and
      # throughput 66,273 -> 103,181, in three documents each.
      - name: Published figures match the runs that produced them
        run: python scripts/check_published_numbers.py

      # `make perf` is not run in CI. Throughput on a shared runner measures the
      # runner, and a number that moves with someone else's build is not a
      # measurement of this pipeline. docs/STORAGE.md records the machine it was
      # taken on; the gate above only checks the prose has not drifted from it.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # Catches broken imports and env misuse that lint and tests miss.
      - run: npm run build

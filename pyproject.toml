[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # Flask decorators legitimately call in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

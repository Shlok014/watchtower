[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data"]
# The importable roots. Without this, `watchtower` sorts as a third-party
# package and every first-party import lands in the wrong isort block.
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # Flask decorators legitimately call in defaults
]

[tool.ruff.lint.isort]
known-first-party = ["watchtower", "eval", "datasets", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# So `pytest` works from anywhere, not only as `python -m pytest` from backend/
# — the -m form silently adds the cwd to sys.path and the bare form does not,
# which makes "works on my machine" depend on which of the two you typed.
pythonpath = ["backend"]
# Quiet the third-party DeprecationWarnings that drown out our own.
filterwarnings = [
    "ignore::DeprecationWarning:drain3.*",
    # joblib sets .shape on a loaded array; numpy 2.5 deprecated that. Third
    # party, and it drowns out warnings from this codebase, which are the ones
    # worth reading.
    "ignore::DeprecationWarning:joblib.*",
]
